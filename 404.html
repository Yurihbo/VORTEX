<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>VORTEX — Biblioteca Virtual</title>
    <script type="text/javascript">
      // Redirecionamento SPA sem exibir erro 404 no GitHub Pages
      var l = window.location;
      var repoName = l.pathname.split('/')[1];
      var base = repoName ? '/' + repoName + '/' : '/';
      var pathWithoutBase = l.pathname.slice(base.length - 1);
      if (pathWithoutBase === '' || pathWithoutBase === '/') {
        l.replace(l.protocol + '//' + l.host + base);
      } else {
        l.replace(l.protocol + '//' + l.host + base + '?p=' + encodeURIComponent(pathWithoutBase + l.search + l.hash));
      }
    </script>
  </head>
  <body>
    <script>
      // Fallback imediato caso o script acima seja bloqueado
      window.location.replace('./');
    </script>
  </body>
</html>
