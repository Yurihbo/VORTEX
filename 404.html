<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>VORTEX — Biblioteca Virtual</title>
    <script type="text/javascript">
      // Captura qualquer URL no GitHub Pages e redireciona para a raiz preservando a rota via query param
      var l = window.location;
      var repoName = l.pathname.split('/')[1];
      var base = repoName ? '/' + repoName + '/' : '/';
      var route = l.pathname.slice(base.length - 1);
      if (!route || route === '/' || route === '') {
        window.location.replace(l.protocol + '//' + l.host + base);
      } else {
        window.location.replace(l.protocol + '//' + l.host + base + '?p=' + encodeURIComponent(route + l.search + l.hash));
      }
    </script>
  </head>
  <body>
    <script>
      window.location.replace('./');
    </script>
  </body>
</html>
